name: Fix upright Workers build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ship/upright
          fetch-depth: 0
      - name: Apply Workers build fixes
        run: |
          set -euo pipefail
          git fetch origin main
          : > /tmp/fix.b64
          for i in 00 01 02; do
            git show "origin/main:.github/scripts/fix_upright_build.b64.$i" >> /tmp/fix.b64
          done
          base64 -d /tmp/fix.b64 > /tmp/fix_upright_build.py
          python3 /tmp/fix_upright_build.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix Workers build: duplicate protocol + merge leftovers on upright"
          git push origin HEAD:ship/upright
