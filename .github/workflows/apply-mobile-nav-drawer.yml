name: Apply mobile nav drawer patch
on:
  workflow_dispatch:
  push:
    branches: [fix/mobile-nav-drawer]
    paths:
      - patches/mobile-nav-drawer.patch
      - .github/workflows/apply-mobile-nav-drawer.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-drawer
          fetch-depth: 0
      - name: Apply mobile nav drawer patch if needed
        run: |
          set -euo pipefail
          if grep -q 'workbench-mobile-menu' src/components/workbench/Workbench.tsx && ! grep -q 'foto-mobile-rail' src/components/workbench/Workbench.tsx; then
            echo "Mobile drawer already wired; nothing to apply."
            exit 0
          fi
          git apply --index patches/mobile-nav-drawer.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mobile: hide pinned nav rail; ChatGPT-style hamburger drawer"
          git push origin HEAD:fix/mobile-nav-drawer
