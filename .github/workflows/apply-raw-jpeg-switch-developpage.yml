name: Apply RAW-JPEG DevelopPage patch
on:
  workflow_dispatch:
  push:
    branches: [feat/raw-jpeg-switch]
    paths:
      - patches/raw-jpeg-switch-develop-page.patch
      - .github/workflows/apply-raw-jpeg-switch-developpage.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/raw-jpeg-switch
          fetch-depth: 0
      - name: Apply DevelopPage patch if needed
        run: |
          set -euo pipefail
          if grep -q 'RawJpegSwitch' src/components/develop/DevelopPage.tsx; then
            echo "DevelopPage already wired; nothing to apply."
            exit 0
          fi
          git apply --index patches/raw-jpeg-switch-develop-page.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply RAW↔JPEG switch wiring to DevelopPage"
          git push origin HEAD:feat/raw-jpeg-switch
